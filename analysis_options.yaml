# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"        # No revisar archivos generados por el sistema
    - "**/*.freezed.dart"  # No revisar código generado por Freezed
    - "**/*.gen.dart"      # No revisar otros archivos generados

linter:
  rules:
    prefer_const_constructors: true            # Usar const cuando algo no cambia
    prefer_final_fields: true                  # Usar final si la variable no va a cambiar
    prefer_const_literals_to_create_immutables: true  # Hacer listas/mapas const si no cambian
    use_key_in_widget_constructors: true       # Pedir un "key" en widgets para mejor control
    avoid_unnecessary_containers: true         # Evitar Containers que no hacen nada útil
    sized_box_for_whitespace: true             # Usar SizedBox en vez de Container para espacio
    use_colored_box: true                      # Usar ColoredBox en vez de Container para color
    prefer_is_empty: true                      # Usar .isEmpty en vez de comparar con ""
    prefer_is_not_empty: true                  # Usar .isNotEmpty en vez de comparar con ""
    use_super_parameters: true                 # Usar "super.algo" en constructores más limpio

    curly_braces_in_flow_control_structures: true   # Poner llaves {} en if, for, while siempre

    use_build_context_synchronously: true      # Evita usar context después de un await que puede romper la app
    unawaited_futures: true                    # Te avisa cuando ignore una Future sin await
    cancel_subscriptions: true                 # Pedir cancelar streams cuando ya no se usan
    close_sinks: true                          # Pedir cerrar controladores de streams para evitar fugas de memoria
    avoid_print: true
    avoid_returning_null_for_void: true        # Evitar retornar null en funciones void
    prefer_null_aware_operators: true          # Usar operadores ?? y ?.
